name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Bash
            os: ubuntu-latest
            compiler: c++
          - name: macOS Bash
            os: macos-latest
            compiler: c++
          - name: Windows PowerShell
            os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CMake version
        run: cmake --version

      - name: Report hosted toolchain through the composite action
        uses: ./actions/report-toolchain
        with:
          compiler: ${{ matrix.compiler }}

      - name: Validate repository contract with Bash
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/validate.sh

      - name: Validate repository contract with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Test the project workflow composite action
        uses: ./actions/project-workflow
        with:
          command: test
          preset: romodular_selftest
          configuration: Debug
          fresh: true
          parallel: 2
          junit: build/validation/composite-action.xml

      - name: Install through the project workflow composite action
        uses: ./actions/project-workflow
        with:
          command: install
          preset: romodular_selftest

      - name: Clean through the project workflow composite action
        uses: ./actions/project-workflow
        with:
          command: clean
          preset: romodular_selftest
          dist: true

name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Bash
            os: ubuntu-latest
          - name: macOS Bash
            os: macos-latest
          - name: Windows PowerShell
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CMake version
        run: cmake --version

      - name: Validate repository contract with Bash
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/validate.sh

      - name: Validate repository contract with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1

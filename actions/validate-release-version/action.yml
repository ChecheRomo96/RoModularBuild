name: Validate release version
description: Require a release tag to match a semantic version stored in a file.

inputs:
  tag:
    description: Existing tag on the checked-out commit.
    required: true
  version-file:
    description: Repository-relative file whose first line contains the semantic version.
    required: false
    default: VERSION
  allow-prerelease:
    description: Allow a hyphenated prerelease suffix after the source version.
    required: false
    default: "false"

outputs:
  tag:
    description: Validated release tag.
    value: ${{ steps.validate.outputs.tag }}
  version:
    description: Semantic version read from the source file.
    value: ${{ steps.validate.outputs.version }}
  release-version:
    description: Release tag without its v prefix.
    value: ${{ steps.validate.outputs.release-version }}
  prerelease:
    description: Whether the tag includes a prerelease suffix.
    value: ${{ steps.validate.outputs.prerelease }}

runs:
  using: composite
  steps:
    - id: validate
      name: Require the tag to match the source version
      shell: bash
      env:
        ROMODULAR_RELEASE_TAG: ${{ inputs.tag }}
        ROMODULAR_VERSION_FILE: ${{ inputs.version-file }}
        ROMODULAR_ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
      run: |
        set -euo pipefail

        version=$(sed -n '1{s/[[:space:]]//g;p;}' "$ROMODULAR_VERSION_FILE")
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "'$ROMODULAR_VERSION_FILE' must contain one semantic version, got '$version'" >&2
          exit 1
        fi

        prerelease=false
        if [[ "$ROMODULAR_RELEASE_TAG" == "v$version" ]]; then
          :
        elif [[ "$ROMODULAR_ALLOW_PRERELEASE" == "true" &&
                "$ROMODULAR_RELEASE_TAG" == "v$version-"* ]]; then
          suffix=${ROMODULAR_RELEASE_TAG#"v$version-"}
          if [[ ! "$suffix" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid prerelease tag '$ROMODULAR_RELEASE_TAG'" >&2
            exit 1
          fi
          prerelease=true
        else
          echo "Tag '$ROMODULAR_RELEASE_TAG' does not match source version '$version'" >&2
          exit 1
        fi

        if ! git tag --points-at HEAD --list "$ROMODULAR_RELEASE_TAG" | grep -Fx "$ROMODULAR_RELEASE_TAG" >/dev/null; then
          echo "'$ROMODULAR_RELEASE_TAG' is not an existing tag on the checked-out commit" >&2
          exit 1
        fi

        release_version=${ROMODULAR_RELEASE_TAG#v}
        {
          echo "tag=$ROMODULAR_RELEASE_TAG"
          echo "version=$version"
          echo "release-version=$release_version"
          echo "prerelease=$prerelease"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Release version validated"
          echo
          echo "- Tag: \`$ROMODULAR_RELEASE_TAG\`"
          echo "- Source version: \`$version\`"
          echo "- Prerelease: \`$prerelease\`"
        } >> "$GITHUB_STEP_SUMMARY"
